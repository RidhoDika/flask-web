<html>
<head>
    <title>Tambah Data</title>
</head>
<body>
    <h1>Tambah Data</h1>
    <form method="POST">
        <label>Nama:</label><br>
        <input type="text" name="nama" required><br>
        <label>Usia:</label><br>
        <input type="number" name="usia" required><br>
        <label>Kota:</label><br>
        <input type="text" name="kota" required><br><br>
        <button type="submit">Simpan</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Kembali</a>
</body>
</html>
